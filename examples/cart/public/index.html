<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fine Coffee Co.</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Fine Coffee Co.</h1>
    <a id="cart-link" href="#cart">Cart</a>
  </header>
  <main>
    <article data-product="House blend">
      <h2>House blend</h2>
      <p>Chocolate, toast, a little smoke.</p>
      <button type="button" aria-label="Add House blend to cart">Add to cart</button>
    </article>
    <article data-product="Ethiopia Guji">
      <h2>Ethiopia Guji</h2>
      <p>Blueberry, jasmine, bright.</p>
      <button type="button" aria-label="Add Ethiopia Guji to cart">Add to cart</button>
    </article>
    <article data-product="Decaf">
      <h2>Decaf</h2>
      <p>All of the coffee, none of the reasons.</p>
      <button type="button" aria-label="Add Decaf to cart">Add to cart</button>
    </article>
  </main>
  <script src="/app.js"></script>
</body>
</html>
